prometheus:
  prometheusSpec:
    retention: 15d
    scrapeInterval: 15s
    nodeSelector:
      monitoring-node: "true"
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    nodeSelector:
      monitoring-node: "true"

grafana:
  enabled: true
  adminPassword: "cedrocks"
  service:
    type: LoadBalancer
  nodeSelector:
    monitoring-node: "true"
  persistence:
    enabled: true
    size: 10Gi
